<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Board</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="container">
        <h1>Kanban Board</h1>
        <div class="input">
            <input class="taskInput" placeholder="Write a task here"></input>
            <!-- Optional category input-->
            <input class="categoryInput" placeholder="Category"></input>
            <button class="add_button">Add new Task</button>
        </div>
        
        <!-- cwagner: Search/filter input to filter tasks by name -->
        <div class="search-container">
            <input class="searchInput" placeholder="Search tasks..."></input>
        </div>
        
        <div class="board">
            <!-- LIST 1 -->
            <div class="list" id="list1">
                <h2>To do</h2>
                
            </div>
            <!-- LIST 2 -->
            <div class="list" id="list2">
                <h2>In Progress</h2>
                
            </div>
            <!-- LIST 3 -->
            <div class="list" id="list3">
                <h2>Done</h2>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
